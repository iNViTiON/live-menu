name = "live-menu-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/"
not_found_handling = "none"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*", "/admin/*"]

# Run: bunx wrangler d1 create live_menu
# Then paste the database_id here
[[d1_databases]]
binding = "DB"
database_name = "live_menu"
database_id = "TODO-run-wrangler-d1-create-live_menu"
migrations_dir = "src/db/migrations"

# R2 bucket for media uploads (images, videos).
# Lifecycle rules (e.g. delete objects older than N days with no references) must be
# configured in the Cloudflare dashboard under R2 → live-menu-media → Settings →
# Lifecycle rules — there is no Wrangler CLI equivalent.
# No CORS policy is needed: all media is served through the Worker (/media/* proxy),
# so browsers never access the bucket directly.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "live-menu-media"

[[durable_objects.bindings]]
name = "BROADCAST_ROOM"
class_name = "BroadcastRoom"

[[migrations]]
tag = "v1"
new_classes = ["BroadcastRoom"]

[vars]
FRONTEND_URL = "https://menu.mitch.ee"
WEBAUTHN_RP_ID = "mitch.ee"
WEBAUTHN_RP_NAME = "Live Menu"
WEBAUTHN_ORIGIN = "https://menu.mitch.ee"
