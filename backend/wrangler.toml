name = "live-menu-api"
main = "src/index.ts"
account_id = "4aab1c14a3d2994422d51d0ac84a16d1"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Run: bunx wrangler d1 create live_menu
# Then paste the database_id here
[[d1_databases]]
binding = "DB"
database_name = "live_menu"
database_id = "1caf8ff8-22a3-41d3-b947-bb3863a9b16b"
migrations_dir = "src/db/migrations"

# R2 bucket for media uploads (images, videos).
# Lifecycle rules (e.g. delete objects older than N days with no references) must be
# configured in the Cloudflare dashboard under R2 → live-menu-media → Settings →
# Lifecycle rules — there is no Wrangler CLI equivalent.
# No CORS policy is needed: all media is served through the Worker (/media/* proxy),
# so browsers never access the bucket directly.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "live-menu-media"

[[durable_objects.bindings]]
name = "BROADCAST_ROOM"
class_name = "BroadcastRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BroadcastRoom"]

[triggers]
crons = ["0 0 * * SUN"]

[vars]
FRONTEND_URL = "http://localhost:5173"
WEBAUTHN_RP_ID = "localhost"
WEBAUTHN_RP_NAME = "Live Menu (Dev)"
WEBAUTHN_ORIGIN = "http://localhost:5173"

[env.production]
routes = [
  { pattern = "menu.mitch.ee/api/*", zone_name = "mitch.ee" },
  { pattern = "menu.mitch.ee/media/*", zone_name = "mitch.ee" },
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "live_menu"
database_id = "1caf8ff8-22a3-41d3-b947-bb3863a9b16b"
migrations_dir = "src/db/migrations"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "live-menu-media"

[[env.production.durable_objects.bindings]]
name = "BROADCAST_ROOM"
class_name = "BroadcastRoom"

[env.production.vars]
FRONTEND_URL = "https://menu.mitch.ee"
WEBAUTHN_RP_ID = "mitch.ee"
WEBAUTHN_RP_NAME = "Live Menu"
WEBAUTHN_ORIGIN = "https://menu.mitch.ee"
